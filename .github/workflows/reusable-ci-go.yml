name: CI reutilizável · serviço Go

on:
  workflow_call:
    inputs:
      service:
        description: 'Nome do serviço (auth-service, evaluation-service)'
        required: true
        type: string
      ecr-repository:
        description: 'Repositório ECR. Ex: togglemaster/auth-service'
        required: true
        type: string
      go-version:
        required: false
        type: string
        default: '1.23'
      aws-region:
        required: false
        type: string
        default: us-east-1
    secrets:
      AWS_ACCESS_KEY_ID:     { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }
      AWS_SESSION_TOKEN:     { required: true }
      GITOPS_TOKEN:          { required: true }

jobs:
  # --------------------------------------------------------------------------
  build-test:
    name: Build e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: go build
        run: go build -v ./...

      # go test sai com 0 mesmo sem nenhum _test.go, imprimindo "[no test files]".
      - name: go test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Cobertura
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # --------------------------------------------------------------------------
  security:
    name: Segurança (SAST + SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      # SAST bloqueante. Threshold separado do SCA de propósito: assim uma CVE
      # nova publicada numa dependência não mascara (nem é mascarada por) um
      # problema no código-fonte.
      - name: SAST · gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -confidence medium ./...

      - name: SCA · relatório completo (informativo)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table

      # Regra de bloqueio do enunciado: vulnerabilidade CRÍTICA reprova.
      # --ignore-unfixed porque CVE sem correção disponível não tem ação
      # possível — reprovar por ela só ensina o time a ignorar o gate.
      - name: SCA · gate CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Segredos versionados
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: secret
          severity: CRITICAL
          exit-code: '1'

  # --------------------------------------------------------------------------
  docker:
    name: Build, scan e push da imagem
    runs-on: ubuntu-latest
    needs: [build-test, lint, security]
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Define a tag
        id: meta
        run: |
          # O run_number evita ImageTagAlreadyExistsException: os repositórios
          # ECR são IMMUTABLE, então um "Re-run all jobs" no mesmo commit
          # falharia ao republicar a mesma tag.
          echo "tag=v1.0.0-$(git rev-parse --short HEAD)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build -t "${{ inputs.service }}:ci" .

      - name: Scan da imagem (gate CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.service }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Credenciais AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login no ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push
        id: image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ inputs.ecr-repository }}"
          docker tag "${{ inputs.service }}:ci" "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  gitops:
    name: GitOps bump
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker]
    uses: DanielBrisch/tech-challenge-03/.github/workflows/gitops-bump.yml@main
    with:
      service: ${{ inputs.service }}
      image: ${{ needs.docker.outputs.image }}
      tag: ${{ needs.docker.outputs.tag }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
