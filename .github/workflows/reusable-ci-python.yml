name: CI reutilizável · serviço Python

on:
  workflow_call:
    inputs:
      service:
        description: 'Nome do serviço (flag-service, targeting-service, analytics-service)'
        required: true
        type: string
      ecr-repository:
        description: 'Repositório ECR. Ex: togglemaster/flag-service'
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: '3.12'
      aws-region:
        required: false
        type: string
        default: us-east-1
    secrets:
      AWS_ACCESS_KEY_ID:     { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }
      AWS_SESSION_TOKEN:     { required: true }
      GITOPS_TOKEN:          { required: true }

jobs:
  # --------------------------------------------------------------------------
  build-test:
    name: Build e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # "Build" em Python é garantir que tudo compila. NÃO usar `import app`
      # aqui: os três serviços executam trabalho em tempo de import — abrem
      # pool de Postgres, instanciam clientes boto3 e, no analytics, sobem uma
      # thread de polling do SQS. Um runner de CI não tem nada disso e o
      # processo morre com sys.exit(1).
      - name: Compilação
        run: python -m compileall -q .

      # pytest sai com código 5 quando não encontra teste nenhum, o que
      # reprovaria o job sem que exista falha real.
      - name: Testes
        run: |
          pip install pytest
          if ls test_*.py tests/ >/dev/null 2>&1; then
            pytest -v
          else
            echo "::notice::sem testes neste serviço — nada a executar"
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install ruff
      - run: ruff check .

  # --------------------------------------------------------------------------
  security:
    name: Segurança (SAST + SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      # SAST bloqueante, separado do SCA de propósito — ver reusable-ci-go.yml.
      - name: SAST · bandit
        run: |
          pip install bandit
          bandit -r . -ll -ii

      - name: SCA · relatório completo (informativo)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table

      - name: SCA · gate CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Segredos versionados
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: secret
          severity: CRITICAL
          exit-code: '1'

  # --------------------------------------------------------------------------
  docker:
    name: Build, scan e push da imagem
    runs-on: ubuntu-latest
    needs: [build-test, lint, security]
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Define a tag
        id: meta
        run: echo "tag=v1.0.0-$(git rev-parse --short HEAD)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build -t "${{ inputs.service }}:ci" .

      - name: Scan da imagem (gate CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.service }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Credenciais AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login no ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push
        id: image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ inputs.ecr-repository }}"
          docker tag "${{ inputs.service }}:ci" "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  gitops:
    name: GitOps bump
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker]
    uses: DanielBrisch/tech-challenge-03/.github/workflows/gitops-bump.yml@main
    with:
      service: ${{ inputs.service }}
      image: ${{ needs.docker.outputs.image }}
      tag: ${{ needs.docker.outputs.tag }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
